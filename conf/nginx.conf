server {
    listen 80;
    server_name novametrics-obervability.local localhost;

    # Document root pointing to the standard Linux path
    root /var/www/novametrics-observability/site;
    index index.html index.htm;

    # Access and error logging isolation
    access_log /var/log/nginx/novametrics-observability_access.log;
    error_log /var/log/nginx/novametrics-observability_error.log;

    # Main location block
    location / {
        try_files $uri $uri/ =404;
    }

    # Optional: custom error page or handling for missing paths
    error_page 404 /404.html;
    
    # Security: restrict hidden files (.git, etc.)
    location ~ /\. {
        deny all;
    }
}