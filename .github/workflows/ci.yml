name: NovaMetrics CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate-site:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Nginx
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx

      - name: Deploy Site to Test Path
        run: |
          sudo mkdir -p /var/www/novametrics/site
          sudo cp -r site/* /var/www/novametrics/site/
          sudo chown -R www-data:www-data /var/www/novametrics

      - name: Configure Nginx Test Server Block
        run: |
          sudo cp conf/nginx.conf /etc/nginx/sites-available/novametrics.conf
          sudo ln -s /etc/nginx/sites-available/novametrics.conf /etc/nginx/sites-enabled/
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t
          sudo systemctl restart nginx

      - name: Run Telemetry Check Script
        run: |
          chmod +x scripts/metrics-check.sh
          # Test local endpoints via curl
          curl -I http://localhost/index.html
          curl -I http://localhost/metrics.html
          # Execute the automated verification script
          ./scripts/metrics-check.sh